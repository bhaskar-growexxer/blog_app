<div class="container p-4">

  <!-- TITLE -->
  <h3 class="mb-4 text-center">
    Real-Time Chat (PHP WebSockets)
  </h3>

  <!-- JOIN MODAL -->
  <div
    class="modal show"
    *ngIf="showJoinModal"
    style="display:block; background: rgba(0,0,0,0.5);"
  >
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Join Chat</h5>
        </div>

        <div class="modal-body">

          <!-- USER NAME -->
          <label class="form-label">Your Name</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="userName"
            placeholder="Enter your name"
          />

          <hr>

          <!-- ACTION BUTTONS -->
          <div class="d-flex justify-content-between">
            <button
              class="btn btn-success"
              (click)="createRoom()"
            >
              Create Room
            </button>

            <button
              class="btn btn-primary"
              (click)="showJoinRoom()"
            >
              Join Room
            </button>
          </div>

          <!-- JOIN ROOM -->
          <div class="mt-3" *ngIf="showJoinRoomBox">
            <label class="form-label">Enter Room ID</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="roomId"
              placeholder="Room ID"
            />
            <button
              class="btn btn-primary mt-2"
              (click)="joinExistingRoom()"
            >
              Join
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ROOM INFO -->
  <div
    class="alert alert-info"
    *ngIf="!showJoinModal"
  >
    ✅ Joined Room:
    <b>{{ roomId }}</b>
    as
    <b>{{ userName }}</b>
  </div>

  <!-- CHAT BOX -->
  <div id="chatBox" class="chat-box">

    <ng-container *ngFor="let msg of messages">

      <!-- SYSTEM MESSAGE -->
      <div
        *ngIf="msg.type === 'system'"
        class="system"
      >
        {{ msg.msg }}
      </div>

      <!-- USER MESSAGE -->
      <div
        *ngIf="msg.type === 'message'"
        class="message"
        [ngClass]="{
          me: msg.name === userName,
          other: msg.name !== userName
        }"
      >
        <b>{{ msg.name }}:</b> {{ msg.msg }}
      </div>

    </ng-container>

  </div>

  <!-- SEND MESSAGE -->
  <div class="input-group mt-3">
    <input
      type="text"
      class="form-control"
      placeholder="Type message..."
      [(ngModel)]="messageText"
      (keyup.enter)="sendMessage()"
    />
    <button
      class="btn btn-primary"
      (click)="sendMessage()"
    >
      Send
    </button>
  </div>

</div>
